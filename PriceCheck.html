<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สแกนบาร์โค้ด</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 12px;
    }
    h1 span { color: #FFD700; }

    #reader {
      width: 100%;
      max-width: 420px;
      border: 2px solid #FFD700;
      border-radius: 12px;
      overflow: hidden;
    }
    #reader video {
      object-fit: cover !important;
      transition: transform 0.15s ease-out;
      transform-origin: center center;
    }

    #zoomWrap {
      width: 100%;
      max-width: 420px;
      margin-top: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    #zoomPresets {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .zoom-btn {
      padding: 8px 14px;
      background: #18181b;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
    }
    .zoom-btn.active {
      background: #FFD700;
      color: #000;
      border-color: #FFD700;
    }
    #zoomSlider { width: 100%; accent-color: #FFD700; }

    #torchBtn {
      display: none;
      margin-top: 10px;
      padding: 12px;
      width: 100%;
      max-width: 420px;
      background: #18181b;
      color: #FFD700;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
    }
    #torchBtn.on {
      background: #FFD700;
      color: #000;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      color: #a1a1aa;
      text-align: center;
      min-height: 20px;
    }
    #closeBtn {
      margin-top: 10px;
      padding: 12px 24px;
      background: #27272a;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
    }
    #retryBtn {
      margin-top: 10px;
      padding: 10px 20px;
      background: #FFD700;
      color: #000;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>PRICE <span>CHECK</span> — สแกน</h1>
  <div id="reader"></div>

  <div id="zoomWrap">
    <div id="zoomPresets">
      <button class="zoom-btn active" data-zoom="1" onclick="setZoom(1)">1x</button>
      <button class="zoom-btn" data-zoom="1.5" onclick="setZoom(1.5)">1.5x</button>
      <button class="zoom-btn" data-zoom="2" onclick="setZoom(2)">2x</button>
      <button class="zoom-btn" data-zoom="3" onclick="setZoom(3)">3x</button>
    </div>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
  </div>

  <button id="torchBtn" onclick="toggleTorch()">🔦 เปิดแฟลช</button>

  <div id="status">กำลังเปิดกล้อง...</div>
  <button id="retryBtn" onclick="startScan()">ลองใหม่</button>
  <button id="closeBtn" onclick="goBack()">ยกเลิก / กลับหน้าหลัก</button>

  <script>
    // อ่านค่า "return" ที่ Apps Script ส่งมาให้ตอนเปิดหน้านี้ (URL ของหน้าแอปหลัก)
    const params = new URLSearchParams(window.location.search);
    const RETURN_URL = params.get('return') || '';

    let scanner = null;
    let torchOn = false;
    let audioCtx = null;
    const statusEl = document.getElementById('status');
    const retryBtn = document.getElementById('retryBtn');
    const zoomWrap = document.getElementById('zoomWrap');
    const zoomSlider = document.getElementById('zoomSlider');
    const torchBtn = document.getElementById('torchBtn');

    function goBack() {
      if (RETURN_URL) {
        window.location.href = RETURN_URL;
      } else {
        history.back();
      }
    }

    // ---------- ปลดล็อกเสียงบน iOS ----------
    function unlockAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) { /* ไม่รองรับก็ไม่เป็นไร */ }
    }
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    function playBeep() {
      try {
        if (!audioCtx) unlockAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) { /* ไม่มีเสียงก็ไม่เป็นไร ยังสั่นได้ */ }
    }

    // ---------- ซูมแบบ CSS (ใช้ได้ทุกเครื่อง) ----------
    function setZoom(value) {
      zoomSlider.value = value;
      applyZoom(value);
    }

    function applyZoom(value) {
      const video = document.querySelector('#reader video');
      if (video) {
        video.style.transform = `scale(${value})`;
      }
      document.querySelectorAll('.zoom-btn').forEach(btn => {
        btn.classList.toggle('active', parseFloat(btn.dataset.zoom) === parseFloat(value));
      });
    }

    zoomSlider.addEventListener('input', function () {
      applyZoom(this.value);
    });

    // ---------- แฟลช (Android เท่านั้น) ----------
    async function toggleTorch() {
      if (!scanner) return;
      const newState = !torchOn;
      try {
        await scanner.applyVideoConstraints({
          advanced: [{ torch: newState }]
        });
        torchOn = newState;
        torchBtn.textContent = torchOn ? '🔦 ปิดแฟลช' : '🔦 เปิดแฟลช';
        torchBtn.classList.toggle('on', torchOn);
      } catch (err) {
        alert('อุปกรณ์นี้ไม่รองรับแฟลช');
      }
    }

    function setupControls() {
      zoomWrap.style.display = 'flex';
      applyZoom(1);

      try {
        const caps = scanner.getRunningTrackCapabilities();
        if (caps.torch) {
          torchBtn.style.display = 'block';
        }
      } catch (e) {
        console.warn('ไม่รองรับแฟลช', e);
      }
    }

    function startScan() {
      retryBtn.style.display = 'none';
      statusEl.textContent = 'กำลังเปิดกล้อง...';

      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      const config = { fps: 10, qrbox: { width: 250, height: 150 } };

      scanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).then(() => {
        statusEl.textContent = 'เล็งกล้องไปที่บาร์โค้ด';
        setupControls();
      }).catch(err => {
        statusEl.textContent = 'เปิดกล้องไม่ได้ กรุณาอนุญาตสิทธิ์กล้องในเบราว์เซอร์';
        retryBtn.style.display = 'inline-block';
        console.error(err);
      });
    }

    // สแกนติด -> เปลี่ยนหน้ากลับไปแอปหลักทันที พร้อมแนบบาร์โค้ดไปกับ URL
    // (ไม่ใช้ postMessage/popup แล้ว เพื่อกันปัญหาแท็บโดนระบบเคลียร์หน่วยความจำ)
    function onScanSuccess(decodedText) {
      playBeep();
      if (navigator.vibrate) navigator.vibrate(100);
      statusEl.textContent = 'เจอแล้ว: ' + decodedText + ' กำลังกลับไปหน้าหลัก...';

      const finish = function () {
        if (RETURN_URL) {
          const sep = RETURN_URL.includes('?') ? '&' : '?';
          window.location.href = RETURN_URL + sep + 'barcode=' + encodeURIComponent(decodedText);
        } else {
          history.back();
        }
      };

      if (scanner) {
        scanner.stop().then(finish).catch(finish);
      } else {
        finish();
      }
    }

    window.addEventListener('load', startScan);
  </script>
</body>
</html>
